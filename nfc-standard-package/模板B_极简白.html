<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展项 · 一碰即达</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M11 11c2.2-2.2 5.8-2.2 8 0M8 8c3.5-3.5 12.5-3.5 16 0M13 13c1.1-1.1 2.9-1.1 4 0M16 16v.1' stroke='%232563EB' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFFFF;
  --bg-2:#F5F5F4;
  --ink:#111111;
  --ink-soft:#6B6B6B;
  --accent:#2563EB;
  --line:#E7E7E4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 40px}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--line);
  max-width:680px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.03em;font-size:14px}
.brand svg{display:block}
.tag-nfc{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11px;letter-spacing:.12em;color:var(--ink-soft);
  border:1px solid var(--line);padding:3px 8px;border-radius:20px;
}

/* ===== 标题区 ===== */
.hero-head{padding:34px 0 4px}
.hero-head .kicker{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11px;letter-spacing:.22em;color:var(--accent);margin-bottom:12px;
}
.hero-head h1{font-weight:900;font-size:36px;line-height:1.18;letter-spacing:-.01em}
.hero-head h1 .accent{color:var(--accent)}
.hero-head .sub{margin-top:12px;font-size:14px;color:var(--ink-soft)}

/* ===== 纵向信息条目（不是三列横条） ===== */
.meta-list{margin:22px 0 0;display:flex;flex-direction:column}
.meta-list .row{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.meta-list .row:first-child{border-top:1px solid var(--line)}
.meta-list .k{font-size:11px;color:var(--ink-soft);letter-spacing:.08em;flex:0 0 auto}
.meta-list .v{font-size:14px;font-weight:700;text-align:right}

/* ===== 卡片堆叠 ===== */
.cards{display:flex;flex-direction:column;gap:16px;margin:22px 0}
.card{background:var(--bg-2);border-radius:18px;padding:20px}
.card.lead-card{padding:24px}
.card .card-label{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
  color:var(--accent);letter-spacing:.12em;margin-bottom:10px;
}
.lead{font-size:18px;font-weight:600;line-height:1.8;color:var(--ink)}
.body-p{color:var(--ink-soft);font-size:15px}
.card figure{margin:0}
.card img{width:100%;border-radius:12px;aspect-ratio:16/10;object-fit:cover;display:block}
.card figcaption{
  padding:10px 2px 0;font-size:12px;color:var(--ink-soft);
  display:flex;justify-content:space-between;
  font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;
}

/* ===== 媒体卡片 ===== */
.audio-card{display:flex;align-items:center;gap:14px}
.audio-btn{
  flex:0 0 auto;width:52px;height:52px;border-radius:50%;
  background:var(--ink);border:none;cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.audio-btn:active{transform:scale(.96)}
.audio-info{flex:1;min-width:0}
.audio-title{font-size:14px;font-weight:700;margin-bottom:4px}
.audio-dur{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft)}
.wave{display:flex;align-items:center;gap:2px;height:22px;margin-top:8px}
.wave i{display:block;width:2.5px;background:var(--accent);border-radius:1px;height:6px;opacity:.55}
.audio-card.playing .wave i{animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{height:5px}50%{height:20px}}

.video-card{cursor:pointer}
.video-thumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:-20px -20px 12px}
.video-thumb .play{width:56px;height:56px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.video-info{padding:0 2px}
.video-title{font-size:14px;font-weight:700}
.video-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* ===== 视频弹窗 ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal video{width:100%;max-width:720px;max-height:80vh}
.modal-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;cursor:pointer}

/* ===== 页脚 ===== */
footer{padding:26px 0 0;text-align:center}
.foot-brand{font-size:12px;letter-spacing:.15em;font-weight:700}
.foot-sub{font-size:11px;color:var(--ink-soft);margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace}

@media (min-width:768px){
  .hero-head h1{font-size:44px}
  .lead{font-size:19px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#111111"/><path d="M11 11c2.2-2.2 5.8-2.2 8 0M8 8c3.5-3.5 12.5-3.5 16 0M13 13c1.1-1.1 2.9-1.1 4 0M16 16v.1" stroke="#2563EB" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    <span id="cfg_brand">一碰即达 · NFC 服务站</span>
  </div>
  <div class="tag-nfc">模板B · 卡片流</div>
</header>

<div class="wrap">

  <div class="hero-head">
    <div class="kicker" id="cfg_kicker">展项编号</div>
    <h1><span id="cfg_title">大标题第一行</span><br><span class="accent" id="cfg_titleAccent">大标题第二行</span></h1>
    <div class="sub" id="cfg_subtitle">副标题写在这里</div>
  </div>

  <!-- 纵向信息条目 -->
  <div class="meta-list">
    <div class="row"><span class="k" id="cfg_pk1">标签一</span><span class="v" id="cfg_pv1">值一</span></div>
    <div class="row"><span class="k" id="cfg_pk2">标签二</span><span class="v" id="cfg_pv2">值二</span></div>
    <div class="row"><span class="k" id="cfg_pk3">标签三</span><span class="v" id="cfg_pv3">值三</span></div>
  </div>

  <!-- 卡片堆叠 -->
  <div class="cards">

    <div class="card lead-card">
      <div class="card-label" id="cfg_sec1Title">正文标题</div>
      <p class="lead" id="cfg_lead">段落1：在这里写引言或开头，一两句话点出这个展项是什么。</p>
    </div>

    <figure class="card" id="photoFig">
      <img id="img_photo" src="assets/模板B/photo.jpg" alt="插图">
      <figcaption><span id="cfg_photoCaption">图 · 插图说明</span><span id="cfg_photoYear">年份</span></figcaption>
    </figure>

    <div class="card">
      <p class="body-p" id="cfg_body1">段落2：在这里写第二段正文，介绍背景、经过或细节。</p>
    </div>

    <div class="card">
      <p class="body-p" id="cfg_body2">段落3：在这里写第三段正文，补充说明或收尾。</p>
    </div>

    <!-- 媒体卡片（音频 / 视频二选一） -->
    <div class="card" id="mediaSection">
      <p class="body-p" id="cfg_audioIntro" style="margin-bottom:14px">在这里写媒体段前面的介绍文字。</p>

      <div class="audio-card" id="audioCard">
        <button class="audio-btn" id="audioBtn" aria-label="播放音频">
          <svg id="icoPlay" width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg id="icoPause" width="20" height="20" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <div class="audio-info">
          <div class="audio-title" id="cfg_audioTitle">音频标题</div>
          <div class="audio-dur"><span id="audioDur">加载中…</span> · <span id="cfg_audioMeta">来源说明</span></div>
          <div class="wave" id="wave"></div>
        </div>
        <audio id="audioEl" preload="metadata"></audio>
      </div>

      <div class="video-card" id="videoCard" style="display:none">
        <div class="video-thumb">
          <div class="play">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg>
          </div>
        </div>
        <div class="video-info">
          <div class="video-title" id="cfg_videoTitle">视频标题</div>
          <div class="video-meta" id="cfg_videoMeta">来源说明</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 视频播放弹窗 -->
  <div class="modal" id="videoModal">
    <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
    <video id="modalVideo" controls playsinline></video>
  </div>

  <footer>
    <div class="foot-brand" id="cfg_footer">一 碰 即 达 · TAP &amp; GO</div>
    <div class="foot-sub" id="cfg_footerSub">HUAXIN 1907 HERITAGE · NFC STANDARD PACK</div>
  </footer>

</div>

<script>
/* ============================================================
 * ★★★  你要改的内容，全部在下面这一块，其他地方不要动  ★★★
 *
 * 改法：只改引号 " " 里面的字；引号、冒号、逗号都保留。
 * 图片和音视频不用改代码，把文件按下面的文件名放进 assets/模板B 文件夹即可。
 * 音频 / 视频二选一：填了视频就把 audioSrc 改成 ""，
 * 填了音频就把 videoSrc 改成 ""；都没有就两个都填 ""。
 * ============================================================ */
const CONFIG = {

  // —— 左上角品牌名（一般不用改）——
  brand: "一碰即达 · NFC 服务站",

  // —— 首屏文字 ——
  kicker:      "展项编号",
  title:       "今晚不睡觉",
  titleAccent: "大标题第二行",
  subtitle:    "副标题写在这里",

  // —— 纵向信息条目（标签 / 值）——
  pk1: "标签一", pv1: "值一",
  pk2: "标签二", pv2: "值二",
  pk3: "标签三", pv3: "值三",

  // —— 正文三段 ——
  sec1Title: "正文标题",
  lead:  "段落1：在这里写引言或开头，一两句话点出这个展项是什么。",
  body1: "段落2：在这里写第二段正文，介绍背景、经过或细节。",
  body2: "段落3：在这里写第三段正文，补充说明或收尾。",

  // —— 中间插图 ——
  photoCaption: "图 · 插图说明",
  photoYear:    "年份",

  // —— 媒体段（音频 / 视频二选一）——
  audioIntro: "在这里写媒体段前面的介绍文字。",
  audioTitle: "音频标题",
  audioMeta:  "来源说明",
  videoTitle: "视频标题",
  videoMeta:  "来源说明",

  // —— 底部统计：从 1 开始累计，每次打开 +1（本机记录，不用改）——
  analyticsId: "",

  // —— 页脚（一般不用改）——
  footer:    "一 碰 即 达 · TAP & GO",
  footerSub: "HUAXIN 1907 HERITAGE · NFC STANDARD PACK",

  // —— 媒体文件路径：放进 assets/模板B 文件夹 ——
  photoImg: "assets/模板B/photo.jpg",
  audioSrc: "assets/模板B/scene.mp3",   // 音频（mp3；二选一，不用就填 ""）
  videoSrc: "",                        // 视频（mp4；二选一，不用就填 ""）
};
/* ============================================================
 *  ★★★  以上是你唯一需要改的地方  ★★★
 * ============================================================ */

// —— 下面是自动填充和功能代码，不要动 ——
(function(){
  function t(id, val){ var el=document.getElementById(id); if(el && val!=null && val!=='') el.textContent=val; }
  t('cfg_brand',CONFIG.brand);
  t('cfg_kicker',CONFIG.kicker);
  t('cfg_title',CONFIG.title);
  t('cfg_titleAccent',CONFIG.titleAccent);
  t('cfg_subtitle',CONFIG.subtitle);
  t('cfg_pk1',CONFIG.pk1); t('cfg_pv1',CONFIG.pv1);
  t('cfg_pk2',CONFIG.pk2); t('cfg_pv2',CONFIG.pv2);
  t('cfg_pk3',CONFIG.pk3); t('cfg_pv3',CONFIG.pv3);
  t('cfg_sec1Title',CONFIG.sec1Title);
  t('cfg_lead',CONFIG.lead);
  t('cfg_body1',CONFIG.body1);
  t('cfg_body2',CONFIG.body2);
  t('cfg_photoCaption',CONFIG.photoCaption);
  t('cfg_photoYear',CONFIG.photoYear);
  t('cfg_audioIntro',CONFIG.audioIntro);
  t('cfg_audioTitle',CONFIG.audioTitle);
  t('cfg_audioMeta',CONFIG.audioMeta);
  t('cfg_videoTitle',CONFIG.videoTitle);
  t('cfg_videoMeta',CONFIG.videoMeta);
  t('cfg_footer',CONFIG.footer);
  t('cfg_footerSub',CONFIG.footerSub);

  document.getElementById('img_photo').src = CONFIG.photoImg;

  // 媒体：视频优先，其次音频，都没有就隐藏整段
  var audioEl = document.getElementById('audioEl');
  var audioCard = document.getElementById('audioCard');
  var videoCard = document.getElementById('videoCard');
  var hasVideo = !!CONFIG.videoSrc;
  var hasAudio = !!CONFIG.audioSrc;

  if(hasVideo){
    videoCard.style.display='block';
    audioCard.style.display='none';
    audioEl.src = '';
  }else if(hasAudio){
    videoCard.style.display='none';
    audioCard.style.display='flex';
    audioEl.src = CONFIG.audioSrc;
  }else{
    document.getElementById('mediaSection').style.display='none';
  }

  document.title = (CONFIG.title||'展项') + ' · 一碰即达';
})();

// 声波条
(function(){
  var w = document.getElementById('wave');
  for (var i=0;i<26;i++){
    var b=document.createElement('i');
    b.style.animationDelay=(i*0.06)+'s';
    w.appendChild(b);
  }
})();

// 音频播放
(function(){
  var card=document.getElementById('audioCard');
  var btn=document.getElementById('audioBtn');
  var ip=document.getElementById('icoPlay');
  var ipa=document.getElementById('icoPause');
  var durEl=document.getElementById('audioDur');
  var audio=document.getElementById('audioEl');

  function fmt(s){
    if(!isFinite(s)) return '--:--';
    var m=Math.floor(s/60), sec=Math.floor(s%60);
    return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
  }
  function syncUI(){
    var p=!audio.paused && !audio.ended;
    card.classList.toggle('playing',p);
    ip.style.display=p?'none':'block';
    ipa.style.display=p?'block':'none';
  }
  btn.addEventListener('click',function(){
    if(audio.paused){ audio.play().catch(function(){ durEl.textContent='未找到音频文件'; }); }
    else { audio.pause(); }
  });
  audio.addEventListener('loadedmetadata',function(){ durEl.textContent=fmt(audio.duration); });
  audio.addEventListener('play',syncUI);
  audio.addEventListener('pause',syncUI);
  audio.addEventListener('ended',syncUI);
  audio.addEventListener('error',function(){ durEl.textContent='未找到音频文件'; });
})();

// 视频弹窗：点卡片打开，关闭时停止播放
(function(){
  var modal=document.getElementById('videoModal');
  var video=document.getElementById('modalVideo');
  var card=document.getElementById('videoCard');
  var close=document.getElementById('modalClose');

  function open(){
    if(!CONFIG.videoSrc) return;
    video.src=CONFIG.videoSrc;
    modal.classList.add('open');
    video.play().catch(function(){});
  }
  function closeModal(){
    video.pause();
    video.removeAttribute('src');
    video.load();
    modal.classList.remove('open');
  }
  card.addEventListener('click',open);
  close.addEventListener('click',closeModal);
  modal.addEventListener('click',function(e){ if(e.target===modal) closeModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
})();

// 访问统计：填了 analyticsId 才加载统计脚本（百度统计），访问次数在统计平台后台查看
(function(){
  var id = CONFIG.analyticsId;
  if(!id) return;
  window._hmt = window._hmt || [];
  var hm = document.createElement('script');
  hm.src = 'https://hm.baidu.com/hm.js?' + id;
  hm.async = true;
  document.head.appendChild(hm);
})();
</script>
</body>
</html>
